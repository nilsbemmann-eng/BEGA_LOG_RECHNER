services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bega
      POSTGRES_PASSWORD: bega
      POSTGRES_DB: bega_frachtpreis
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bega -d bega_frachtpreis"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://bega:bega@db:5432/bega_frachtpreis
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - backend-storage:/app/local_storage

  frontend:
    build:
      context: ./frontend
      # Beide Werte werden von Next.js beim Build ausgewertet (siehe
      # frontend/Dockerfile) - "backend" ist der Compose-Servicename, ueber
      # den der Frontend-Container das Backend im internen Docker-Netzwerk
      # erreicht (nicht "localhost").
      args:
        NEXT_PUBLIC_API_BASE_URL: http://backend:8000
        BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  backend-storage:
